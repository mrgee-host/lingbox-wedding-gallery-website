<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wedding Photobooth — Gallery</title>
<style>
:root{
  --gold:#f4cf69; --text:#fff; --muted:rgba(255,255,255,.66);
  --card-w: min(300px, 25vw);
  --card-h: calc(var(--card-w) * 1.5);
  --stage-offset: 60px;
}

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090807;color:var(--text);font-family:Inter,sans-serif; touch-action: pan-y;}

#ambient{position:fixed;inset:-10%;z-index:1;background-color:#090807;background-position:center;background-size:cover;filter:blur(45px) saturate(1.4) brightness(0.65);transform:scale(1.1);opacity:1;transition:background-image 0.9s ease;}
#shade{position:fixed;inset:0;z-index:2;background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);pointer-events:none}

header{position:absolute;top:0;left:0;width:100%;padding-top:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;pointer-events:none;}
.header-titles h1{font-family:Georgia,serif;margin:0 0 6px;font-size:28px;color:var(--gold);font-weight:700;}
.header-titles p{margin:0;color:#eee;font-size:13px;letter-spacing:0.5px;}

main{height:100vh;position:relative;display:flex;align-items:center;justify-content:center;z-index:10;}
.stage{position:relative;width:min(1200px,100vw);height:min(700px,calc(100vh - 50px));display:flex;align-items:center;justify-content:center;perspective:1200px;transform-style:preserve-3d; margin-top: var(--stage-offset);}

.card{position:absolute;left:50%;top:50%;width:var(--card-w);height:var(--card-h);transform-origin:center center;transition:transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1),opacity 0.9s ease,filter 0.9s ease;cursor:pointer;will-change:transform, opacity, filter;}

.card-scaler{
  width:100%; height:100%; border-radius:4px; overflow:hidden; position:relative; 
  background:#ffffff; 
  box-shadow:0 25px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1);
  transition:box-shadow 0.9s ease; 
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
  transform: translate3d(0,0,0);
}

.card-scaler img{
  width:100%; height:100%; display:block; object-fit:cover; position:relative; z-index:1;
  background-color: #ffffff;
  transform: translate3d(0,0,0) scale(1.01);
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
  outline: 1px solid transparent;
  will-change: transform;
}

.card.center .card-scaler{box-shadow:0 0 60px rgba(244, 207, 105, 0.35), 0 45px 100px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,.3);}

.card-scaler::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.15) 0%,transparent 45%);z-index:2;opacity:0;transition:opacity 0.9s;pointer-events:none}
.card.center .card-scaler::before{opacity:1}
.card-scaler::after{content:"";position:absolute;top:0;left:-150%;width:150%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent);transform:skewX(-25deg);z-index:3;pointer-events:none}
.card.center .card-scaler::after{animation:shine 2s cubic-bezier(0.25, 1, 0.3, 1) 0.5s forwards}
@keyframes shine{0%{left:-150%;opacity:0}20%{opacity:1}100%{left:150%;opacity:0}}

/* LENCANA LOKASI DENGAN EFEK KACA PEMBESAR */
.loc-badge {
  position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(3px);
  padding: 6px 14px; border-radius: 20px; color: #fff; font-size: 11px; font-weight: 500;
  display: flex; align-items: center; gap: 6px;
  border: 1px solid rgba(255,255,255,0.2); z-index: 10;
  opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
  white-space: nowrap;
}
.card.center .loc-badge { opacity: 1; }
.loc-dot { width: 6px; height: 6px; background: var(--gold); border-radius: 50%; display: inline-block; }

.zoom-btn{position:absolute;bottom:10px;right:10px;width:38px;height:38px;background:rgba(0,0,0,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;z-index:10;opacity:0;pointer-events:none;transition:0.3s ease;backdrop-filter:blur(3px);border:1px solid rgba(255,255,255,0.2);}
.card.center .zoom-btn{opacity:1;pointer-events:auto;}
.zoom-btn:hover{background:var(--gold);color:#000;transform:scale(1.1);}
.zoom-btn svg{width:24px;height:24px;fill:currentColor;}

.card.center{z-index:5; transform:translate(-50%,-50%) translateZ(0px) scale(1); filter:none; opacity:1;}
.card.left{z-index:3;transform:translate(-50%,-50%) translateX(calc(var(--card-w) * -0.85)) translateZ(-150px) rotateY(20deg) scale(0.95);filter:saturate(.8) brightness(.7);opacity:.95}
.card.right{z-index:3;transform:translate(-50%,-50%) translateX(calc(var(--card-w) * 0.85)) translateZ(-150px) rotateY(-20deg) scale(0.95);filter:saturate(.8) brightness(.7);opacity:.95}
.card.farleft{z-index:1;transform:translate(-50%,-50%) translateX(calc(var(--card-w) * -1.5)) translateZ(-250px) rotateY(35deg) scale(0.8);filter:brightness(.4);opacity:.6}
.card.farright{z-index:1;transform:translate(-50%,-50%) translateX(calc(var(--card-w) * 1.5)) translateZ(-250px) rotateY(-35deg) scale(0.8);filter:brightness(.4);opacity:.6}
.card.hidden{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.45)}

.nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(20,20,20,.30);color:white;font-size:22px;display:grid;place-items:center;cursor:pointer;z-index:25;backdrop-filter:blur(10px);transition:background 0.3s}
.nav:hover{background:rgba(255,255,255,.2)}.nav.prev{left:24px}.nav.next{right:24px}

.bottom{position:fixed;left:0;right:0;bottom:35px;padding:0 36px;display:flex;justify-content:flex-end;align-items:end;z-index:20;pointer-events:none;}
.hint{font-size:10px;color:rgba(255,255,255,.58);text-align:right;line-height:1.4; pointer-events:auto;}

/* POSISI TITIK INDIKATOR DITURUNKAN */
.dots{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);display:flex;gap:6px;z-index:20}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25);transition:.3s;cursor:pointer;}.dot.active{width:18px;border-radius:10px;background:#f1cf62}

.wa-btn { position:fixed; bottom:25px; left:50%; transform:translateX(-50%); background:#25d366; color:#fff; font-family:Inter, sans-serif; font-weight:700; font-size:14px; text-decoration:none; padding:12px 24px; border-radius:50px; display:flex; align-items:center; gap:8px; box-shadow:0 10px 25px rgba(37,211,102,0.4); z-index:50; transition:transform 0.2s, background 0.2s; border:1px solid rgba(255,255,255,0.2); pointer-events:auto; }
.wa-btn:hover { background:#20bd5a; transform:translateX(-50%) scale(1.05); }
.wa-btn svg { width:20px; height:20px; fill:#fff; }

#lightbox { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
#lightbox.show { opacity: 1; pointer-events: auto; }
#lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
#lightbox.show img { transform: scale(1); }
.lb-close { position: absolute; top: 25px; right: 25px; width: 45px; height: 45px; background: rgba(255,255,255,0.15); color: #fff; border-radius: 50%; display: grid; place-items: center; font-size: 22px; cursor: pointer; transition: background 0.3s; font-family: sans-serif; }
.lb-close:hover { background: rgba(255,255,255,0.35); }

@media(max-width:800px){
 :root { --card-w: min(240px, 65vw); } 
 header { padding-top: 20px; } 
 .header-titles h1{font-size:22px; margin-bottom:4px;}
 .stage{height:100vh; margin-top: calc(var(--stage-offset) - 80px);}
 .card.left{transform:translate(-50%,-50%) translateX(calc(var(--card-w) * -0.65)) translateZ(-100px) rotateY(20deg) scale(0.9)}
 .card.right{transform:translate(-50%,-50%) translateX(calc(var(--card-w) * 0.65)) translateZ(-100px) rotateY(-20deg) scale(0.9)}
 .card.farleft,.card.farright{display:none}
 .nav.prev{left:10px; width:35px; height:35px; font-size:18px;}
 .nav.next{right:10px; width:35px; height:35px; font-size:18px;}
 .bottom{bottom:25px;padding:0 20px;justify-content:center;}.hint{display:none}
 .dots{bottom: 80px;}
}
</style>
</head>
<body>
<div id="ambient"></div><div id="shade"></div>

<header>
  <div class="header-titles">
    <h1>Lingbox Wedding Gallery</h1>
    <p>Mengabadikan setiap tawa dan cerita di hari paling bahagia</p>
  </div>
</header>

<main>
  <button class="nav prev" aria-label="Previous">‹</button>
  <div class="stage" id="stage"></div>
  <button class="nav next" aria-label="Next">›</button>
</main>

<div class="bottom">
  <div class="hint">Klik ikon 🔍 untuk ZOOM • Geser foto untuk melihat lainnya</div>
</div>
<div class="dots" id="dots"></div>

<a href="https://wa.me/6285270022255?text=Halo%2C%20saya%20ingin%20tanya%20paket%20Photobooth!" class="wa-btn" target="_blank">
  <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  Booking Sekarang
</a>

<div id="lightbox">
  <div class="lb-close">✕</div>
  <img id="lb-img" src="" alt="Zoom Photo">
</div>

<script>

const lockedCount = 4;
let originalFiles = [{"src":"https://i.imgur.com/B4rsmji.jpeg","label":"Padangsidimpuan"},{"src":"https://i.imgur.com/67lWsZs.jpeg","label":"Padangsidimpuan"},{"src":"https://i.imgur.com/GDMlpk3.jpeg","label":"Pandan"},{"src":"https://i.imgur.com/q2qcho4.jpeg","label":"Pandan"},{"src":"https://i.imgur.com/gv7Sn50.jpeg","label":"Pandan"},{"src":"https://i.imgur.com/LJZ1c6i.jpeg","label":"Pandan"},{"src":"https://i.imgur.com/00m5TVf.jpeg","label":"Pandan"},{"src":"https://i.imgur.com/t6dDt1O.jpeg","label":"Pandan"},{"src":"https://i.imgur.com/7SCgG33.jpeg","label":"Padangsidimpuan"},{"src":"https://i.imgur.com/7KnQz7C.jpeg","label":"Padangsidimpuan"}];
let finalFiles = [];

if (lockedCount > 0 && originalFiles.length > lockedCount) {
  let fixedPart = originalFiles.slice(0, lockedCount);
  let randomPart = originalFiles.slice(lockedCount);
  
  for (let i = randomPart.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [randomPart[i], randomPart[j]] = [randomPart[j], randomPart[i]];
  }
  finalFiles = fixedPart.concat(randomPart);
} else if (lockedCount === 0) {
  let randomPart = [...originalFiles];
  for (let i = randomPart.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [randomPart[i], randomPart[j]] = [randomPart[j], randomPart[i]];
  }
  finalFiles = randomPart;
} else {
  finalFiles = originalFiles;
}

const state = {
  files: finalFiles,
  index: 0, timer: null,
  cards: []
};
const stage=document.getElementById("stage"), dots=document.getElementById("dots");
const ambient=document.getElementById("ambient");
const lightbox=document.getElementById("lightbox"), lbImg=document.getElementById("lb-img");

function init() {
  state.files.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "card hidden";
    
    const scaler = document.createElement("div");
    scaler.className = "card-scaler";
    
    const img = document.createElement("img");
    img.src = item.src;
    
    const zoomBtn = document.createElement("div");
    zoomBtn.className = "zoom-btn";
    zoomBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zm.5-7H9v2H7v1h2v2h1v-2h2V9h-2V7z"/></svg>';
    
    zoomBtn.onclick = (e) => {
      e.stopPropagation(); 
      if(state.index === i) {
        lbImg.src = item.src;
        lightbox.classList.add("show");
        clearInterval(state.timer); 
      }
    };
    
    scaler.appendChild(img);
    scaler.appendChild(zoomBtn);
    card.appendChild(scaler);

    if(item.label) {
      const badge = document.createElement("div");
      badge.className = "loc-badge";
      badge.innerHTML = '<span class="loc-dot"></span>' + item.label;
      card.appendChild(badge);
    }
    
    card.onclick = () => { 
      if(state.index !== i) {
        state.index = i; 
        render(); 
        restart(); 
      }
    };
    
    stage.appendChild(card);
    state.cards.push(card);

    const d = document.createElement("span");
    d.className = "dot";
    d.onclick = () => { state.index = i; render(); restart(); };
    dots.appendChild(d);
  });
  render();
  restart();
}

function render(){
  const n = state.files.length;
  state.cards.forEach((card, i) => {
    const d = (i - state.index + n) % n;
    card.className = "card " + (d === 0 ? "center" : d === 1 ? "right" : d === n - 1 ? "left" : d === 2 ? "farright" : d === n - 2 ? "farleft" : "hidden");
  });

  Array.from(dots.children).forEach((dot, i) => {
    dot.className = "dot" + (i === state.index ? " active" : "");
  });

  const activeCard = state.cards[state.index];
  if(activeCard) {
    const imgSrc = activeCard.querySelector("img").src;
    ambient.style.backgroundImage = "url('" + imgSrc + "')";
  }
}

function next(){if(state.files.length<=1)return;state.index=(state.index+1)%state.files.length;render();restart()}
function prev(){if(state.files.length<=1)return;state.index=(state.index-1+state.files.length)%state.files.length;render();restart()}
function restart(){clearInterval(state.timer);state.timer=setInterval(next,3000)}

lightbox.onclick = () => {
  lightbox.classList.remove("show");
  restart(); 
};

document.querySelector(".next").onclick=next; document.querySelector(".prev").onclick=prev;
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")next();
  if(e.key==="ArrowLeft")prev();
  if(e.key==="Escape") lightbox.classList.remove("show");
});

let touchstartX = 0;
let touchendX = 0;
document.addEventListener('touchstart', e => {
  touchstartX = e.changedTouches[0].screenX;
}, {passive: true});

document.addEventListener('touchend', e => {
  touchendX = e.changedTouches[0].screenX;
  if (touchendX < touchstartX - 50) next(); 
  if (touchendX > touchstartX + 50) prev(); 
}, {passive: true});

init();

</script>
</body>
</html>
